name: LocalClips macOS CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required macOS build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify macOS 27 arm64 toolchain
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          case "$sdk_version" in
            27.*) ;;
            *) printf 'Expected macOS SDK 27.x, got %s\n' "$sdk_version" >&2; exit 1 ;;
          esac

      - name: Static checks
        run: ./app/check.sh

      - name: ADR-0002 regression tests
        run: ./app/test-adr-0002.sh

      - name: Build native app
        run: ./app/build.sh

      - name: Verify built app
        run: |
          lipo -verify_arch arm64 artifacts/LocalClips.app/Contents/MacOS/LocalClips
          codesign --verify --deep --strict artifacts/LocalClips.app
